name: Verify website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_SITE_URL: https://rockstackds.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture visual snapshots
        run: |
          npm run serve &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4175 >/dev/null && break
            sleep 1
          done
          node scripts/capture-home.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rockstack-visual-qa
          path: artifacts/*.png
